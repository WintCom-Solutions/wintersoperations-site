name: cleanup-stale-branches
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete stale branches
        run: |
          git config user.email "noreply@github.com"
          git config user.name "GitHub Actions"
          for branch in $(git branch -r --format='%(refname:short)' | grep -E '^origin/(claude|codex)/'); do
            branch_name=${branch#origin/}
            days_old=$(git log -1 --format=%cd --date=short $branch | xargs -I {} date -d {} +%s | xargs -I {} echo $((($(/bin/date +%s) - {}) / 86400)))
            if [ "$days_old" -gt 30 ] 2>/dev/null; then
              git push origin --delete "$branch_name" || true
            fi
          done
          git fetch origin --prune
