name: Ninja Jump

# Task Force Ninja posts presence when work starts.
# Issue #268: no auto-comment on every stage label. Manual only.
# Jobs no-op unless vars.TASKFORCE_ACTIONS_MODE is lite or full.

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Issue or PR number"
        required: true
      kind:
        description: "issue or pr"
        required: true
        default: issue
        type: choice
        options:
          - issue
          - pr
      label:
        description: "Stage label to mention"
        required: false
        default: "stage:build"

permissions:
  issues: write
  pull-requests: write

jobs:
  jump:
    runs-on: ubuntu-latest
    if: ${{ vars.TASKFORCE_ACTIONS_MODE == 'lite' || vars.TASKFORCE_ACTIONS_MODE == 'full' }}
    steps:
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: 4679699
          private-key: ${{ secrets.TASKFORCE_BUILDER_APP_PRIVATE_KEY }}
      - name: Post ninja presence
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL: ${{ inputs.label }}
          NUMBER: ${{ inputs.number }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail

          LABELS=$(gh "$KIND" view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          echo "$LABELS" | grep -qx 'ai-task' || {
            echo "Not an ai-task item — ninja stays home."
            exit 0
          }

          if gh "$KIND" view "$NUMBER" --repo "$REPO" --comments --json comments \
            --jq '.comments[-15:] | .[].body' 2>/dev/null | grep -q 'Task Force Ninja.*jumped into'; then
            echo "Ninja already present — skip."
            exit 0
          fi

          BODY=$(cat <<EOF
          > 🥷 **Task Force Ninja** jumped into \`$REPO\`
          >
          > Stage: \`$LABEL\` · Standing by. Scope = this item. Rules = AGENTS.md.
          > Katana sharp. Packets optional.
          EOF
          )

          BODY=$(printf '%s\n' "$BODY" | sed 's/^[[:space:]]*//')

          gh "$KIND" comment "$NUMBER" --repo "$REPO" --body "$BODY"
          echo "Ninja jumped into $REPO #$NUMBER ($LABEL)"
